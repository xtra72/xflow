# GitHub Release 자동 노트 생성 카테고리 설정
# softprops/action-gh-release@v2의 generate_release_notes: true와 함께 동작한다.
# PR 라벨에 따라 카테고리별로 자동 분류된다.

changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]

  categories:
    - title: 🚀 Features
      labels:
        - feat
        - feature
        - enhancement

    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix

    - title: 📝 Documentation
      labels:
        - docs
        - documentation

    - title: 🔒 Security
      labels:
        - security
        - vulnerability

    - title: 🔧 Other Changes
      labels:
        - "*"
