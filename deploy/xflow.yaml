# xflowd production configuration (Linux x86-64 / arm64 / Raspberry Pi)
# Location: /etc/xflow/xflow.yaml
# rpi-pkg / amd64-pkg 설치 패키지가 공통으로 번들하는 기본 설정 템플릿.

server:
  port: 8081
  host: "0.0.0.0"
  mode: "production"
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  cors:
    enabled: false
  rate_limit:
    enabled: true
    requests_per_second: 100
  web_ui:
    enabled: true
    dir: "/opt/xflow/web/dist"
  # 기본 인증 (SPEC-DASHBOARD-001) — enabled=false 또는 미지정이면 xflowd 부팅 거부.
  basic_auth:
    enabled: true
    # 자격증명 마이그레이션 yaml 경로. 서비스 접근 가능 경로(ReadWritePaths=/opt/xflow)로
    # 지정한다. 빈 값이면 $HOME/.xflow/users.yaml 폴백 → ProtectHome=true systemd 서비스에서
    # permission denied 로 부팅 실패한다. 파일이 없으면 SQLite 에 admin/admin 자동 생성.
    credentials_file: "/opt/xflow/data/users.yaml"
    jwt_secret: ""              # 빈 값 → 자동 생성(재시작마다 변경). 고정하려면 값 지정.
    token_expiry: "24h"
    refresh_expiry: "168h"

engine:
  backpressure_threshold: 1000
  max_concurrent_flows: 50
  execution_policy: "parallel"
  wire_default_buffer: 0

storage:
  type: "sqlite"
  sqlite:
    path: "/opt/xflow/data/xflow.db"
  pool_size: 5

auth:
  jwt:
    secret: ""  # Set via /etc/xflow/env or XFLOW_AUTH_JWT_SECRET
    access_ttl: "15m"
    refresh_ttl: "168h"
  api_key:
    enabled: true

observe:
  default_level: "info"
  metrics:
    enabled: true
  trace:
    enabled: false

script:
  timeout: "5s"
  vm_pool_size: 4
  sandbox:
    enabled: true
    max_memory_mb: 32
    max_execution_ms: 5000

plugin:
  directory: "/opt/xflow/plugins"
  wasm:
    enabled: true
  go:
    enabled: true

# --- 원격 관리 (SPEC-REMOTE-001) ---
# mode: disabled(기본) | server | client
#   disabled : 원격 관리 비활성(기존 동작과 동일).
#   server   : 다른 xflow(클라이언트)를 등록·승인·원격 제어하는 관리 서버.
#              관리 WS(/api/remote/ws) + admin REST(/api/v1/remote/*) 활성화.
#   client   : server_url 로 dial 하여 등록 요청하는 관리 대상 장비.
remote_management:
  mode: disabled

  # --- mode: server 일 때 ---
  # bootstrap_secret: ""          # (선택) 사전 공유 시크릿. 클라이언트도 동일 값이어야 등록 통과.
  # require_secure: false         # true 면 평문 ws 거절(wss 강제).
  # public_base_url: ""           # (선택) asset 다운로드 공개 base (예: https://mgmt.example.com). 비우면 요청 Host 유도(https 강제).
  # releases_dir: ""              # (선택) 바이너리+.sig 저장 디렉토리. 비우면 {dir(sqlite_path)}/releases.

  # --- mode: client 일 때 ---
  # server_url: "wss://<관리서버-주소>:8081/api/remote/ws"  # 운영은 wss:// 필수(서버 TLS 시)
  # insecure_skip_verify: false   # (선택) 자체 서명/사설망 관리 서버일 때만 true(테스트 전용).
  # instance_id: ""               # 비우면 최초 기동 시 자동 생성·영속.
  # auto_register: true           # 미등록 시 자동 등록 요청 전송.
  # heartbeat_interval: "30s"     # 연결 생존성 heartbeat 주기.
