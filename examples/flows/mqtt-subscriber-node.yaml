# mqtt-subscriber-node.yaml
# MQTT 센서 데이터 수신 플로우 (mqtt-subscriber 노드 사용)
#
# mqtt-subscriber 노드는 MQTT 에이전트에 직접 연결하여
# 지정한 토픽의 메시지를 구독 수신한다.
# bridge 노드 + direction: "in" 조합을 단일 노드로 대체한다.
#
# ┌──────────────────────────────────────────────────────────────────┐
# │                        데이터 흐름                                │
# ├──────────────────────────────────────────────────────────────────┤
# │                                                                  │
# │  [센서 수신 → 필터 → 로깅]                                      │
# │    mqtt-sub ──→ temp-filter ──→ console-out                     │
# │                                                                  │
# │  [에러 → 로깅]                                                   │
# │    *:error ──→ error-logger                                      │
# │                                                                  │
# └──────────────────────────────────────────────────────────────────┘
#
# mqtt-subscriber 노드 설정:
#   agent_ref:      MQTT 에이전트 이름 (필수)
#   topics:         구독할 토픽 목록 (선택, 에이전트 자체 토픽과 별도)
#   payload_format: 페이로드 변환 방식 (선택, 기본값 "json")
#   buffer_size:    수신 버퍼 크기 (선택, 기본값 256)
#
# 출력 메시지 형식 (JSON 페이로드):
#   {
#     "device_id": "sensor-001",
#     "temperature": 25.5,
#     "humidity": 60.2
#   }
#
# 비 JSON 페이로드 수신 시:
#   { "_raw": <원본 바이트> }
#
# 사용법:
#   xflow agent import -f examples/agents/mqtt-sensor.yaml
#   xflow agent import -f examples/agents/stdout-logger.yaml
#   xflow flow import -f examples/flows/mqtt-subscriber-node.yaml
#   xflow flow deploy mqtt-subscriber-node
#   xflow flow start mqtt-subscriber-node

name: "mqtt-subscriber-node"
description: "MQTT 센서 데이터 구독 수신 - mqtt-subscriber 노드 사용"
config:
  track_history: true
  max_history_size: 200
  error_handling: "propagate"
  log_level: "info"
metadata:
  author: "xtra"
  version: "1.0"
  domain: "iot-sensor"

required_agents:
  - name: "mqtt-sensor-agent"
    type: "mqtt-client"
  - name: "stdout-logger"
    type: "logger"
  - name: "error-logger"
    type: "logger"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 센서 수신 경로
  # ═══════════════════════════════════════════════════════════════

  # ── 1단계: MQTT 센서 데이터 구독 ──
  # mqtt-subscriber 노드가 에이전트 초기화 시 지정 토픽을 자동 구독한다.
  # bridge 노드와 달리 direction 설정이 필요 없으며,
  # SourceNode로서 자체적으로 메시지를 생성하여 하류 노드에 전달한다.
  - name: "mqtt-sub"
    type: "mqtt-subscriber"
    config:
      agent_ref: "mqtt-sensor-agent"
      topics:
        - "sensor/temperature"
        - "sensor/humidity"
      payload_format: "json"
      buffer_size: 128
    outputs:
      - "out"
    errors:
      - "error"

  # ── 2단계: 온도 유효성 필터 ──
  # temperature 범위(-40 ~ 150)를 벗어나는 데이터를 제거한다.
  - name: "temp-filter"
    type: "filter"
    config:
      condition: "exists($.payload.temperature) && $.payload.temperature >= -40 && $.payload.temperature <= 150"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  # ── 3단계: 콘솔 출력 ──
  - name: "console-out"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "stdout-logger"
      direction: "out"

  # ═══════════════════════════════════════════════════════════════
  # 에러 로깅
  # ═══════════════════════════════════════════════════════════════

  - name: "error-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "error-logger"
      direction: "out"

wires:
  # 센서 수신 → 필터 → 출력
  - source: "mqtt-sub:out"
    target: "temp-filter:in"
  - source: "temp-filter:out"
    target: "console-out:in"

  # 에러 라우팅
  - source: "temp-filter:error"
    target: "error-logger:in"
