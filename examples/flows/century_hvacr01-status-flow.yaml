# century_hvacr01-status-flow.yaml
# Century HVACR-01 패시브 캡처 + 디코딩 데모 플로우 — SPEC-CENTURY-HVACR-001
#
# 식별자 매핑 (rename 이후):
#   - 프로토콜 코드: century_icp01 (Century ICP-01 wire protocol)
#   - 에이전트 타입: century_hvacr01 (Century HVACR-01)
#   - 노드 타입: century_hvacr01_status / century_hvacr01_control / century_hvacr01
#   - 별도 century-raw-frame 노드는 제거되었고, status 노드의 emit_raw_frames 옵션으로 흡수됨
#
# Century HVACR-01 에이전트는 RS-485 회선을 RX-only 로 sniff 하며 송신은 일절 하지
# 않는다. 본 플로우는 3 종 노드의 사용 방식을 모두 보여준다:
#
#   1. century_hvacr01_status   → 디코딩된 reg 0x02/0x03/0x04 응답을 stdout 으로
#   2. century_hvacr01_status   → emit_raw_frames=true 활성화 시 모든 raw 프레임도 함께 emit
#   3. century_hvacr01_control  → 항상 not_supported 응답 (passive 검증)
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │                          데이터 흐름                                 │
# ├─────────────────────────────────────────────────────────────────────┤
# │                                                                     │
# │  [상태 디코딩 경로]                                                  │
# │    hvacr01-status ──→ status-stdout                                 │
# │                                                                     │
# │  [원시 프레임 아카이브 경로 — status 노드의 emit_raw_frames 옵션]    │
# │    hvacr01-raw-archive ──→ raw-file                                 │
# │                                                                     │
# │  [제어 미지원 데모 — UI 의 제어 시도가 어떻게 처리되는지 보여줌]     │
# │    control-input(bridge in) ──→ hvacr01-control ──→ control-stdout │
# │                                                                     │
# │  [에러 라우팅]                                                       │
# │    *:error ──→ error-logger                                         │
# │                                                                     │
# └─────────────────────────────────────────────────────────────────────┘
#
# century_hvacr01_status 출력 메시지 형식 (REQ-CENTURY-020, SPEC §4.4 예시 1):
#   {
#     "type": "century_reg02_response",
#     "timestamp": 1737216000123,
#     "seq": 1024,
#     "src_addr": 1, "dst_addr": 48,
#     "sub_dev_id": 59, "register": 2,
#     "fields": {
#       "mode":       { "value": "cool",    "raw": 1,   "confirmation_status": "confirmed" },
#       "fan":        { "value": 17,        "raw": 17,  "confirmation_status": "confirmed" },
#       "setpoint_c": { "value": 25.0,      "raw": 250, "confirmation_status": "confirmed" },
#       ... (17개 모든 data 바이트가 typed 필드로 노출)
#     }
#   }
#
# century_hvacr01_control 출력 메시지 형식 (REQ-CENTURY-017):
#   {
#     "status": "not_supported",
#     "reason": "century_passive_only",
#     "message": "Century HVACR-01 agent operates in passive sniff mode; control commands are never transmitted",
#     "request": <원본 요약>
#   }
#
# 사용법:
#   xflow agent import -f examples/agents/century_hvacr01.yaml
#   xflow agent import -f examples/agents/stdout-logger.yaml
#   xflow agent import -f examples/agents/error-logger.yaml
#   xflow flow import -f examples/flows/century_hvacr01-status-flow.yaml
#   xflow flow deploy century_hvacr01-status-flow
#   xflow flow start  century_hvacr01-status-flow

name: "century_hvacr01-status-flow"
description: "Century HVACR-01 패시브 sniff + 3종 노드 데모 (SPEC-CENTURY-HVACR-001, raw-frame 통합)"
config:
  track_history: true
  max_history_size: 500
  error_handling: "propagate"
  log_level: "info"
metadata:
  author: "xtra"
  version: "1.1"
  domain: "hvac-monitoring"
  spec: "SPEC-CENTURY-HVACR-001"

required_agents:
  - name: "century-living-room"
    type: "century_hvacr01"
  - name: "stdout-logger"
    type: "logger"
  - name: "error-logger"
    type: "logger"
  - name: "raw-file-logger"
    type: "logger"

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # 1. 디코딩된 상태 이벤트 경로
  # ═══════════════════════════════════════════════════════════════════

  # ── 폴링 기반 상태 디코딩 ──
  # century_hvacr01 에이전트의 ring buffer 를 polling 하여 reg 0x02/0x03/0x04 응답과
  # WRITE 요청을 typed payload 로 emit. FrameNotifyCh 지원으로 새 frame 도착
  # 시 polling 주기를 기다리지 않고 즉시 반응한다 (AC-C8).
  - name: "hvacr01-status"
    type: "century_hvacr01_status"
    config:
      agent_ref: "century-living-room"
      poll_interval: "100ms"
      timeout: "5s"
      poll_command: "drain"
      recent_count: 10
      batch_size: 32
      emit_raw_frames: false   # decoded status 만 emit (raw frame 은 아래 별도 인스턴스에서)
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  - name: "status-stdout"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "stdout-logger"
      direction: "out"

  # ═══════════════════════════════════════════════════════════════════
  # 2. 원시 프레임 아카이브 경로 (디버깅·역공학용)
  # ═══════════════════════════════════════════════════════════════════
  #
  # rename 이후: 별도 century-raw-frame 노드는 제거되었고, century_hvacr01_status
  # 노드의 emit_raw_frames=true 옵션으로 동일 기능을 제공한다. 옵션 활성화 시
  # ring buffer 를 drain 하여 dedupe_writes 와 무관하게 회선상 관측된 모든 frame 을
  # emit 한다. CRC 불일치 / payload prefix 위반 프레임도 validation_stage 메타와
  # 함께 노출되므로 미확정 필드 의미 발굴에 활용 가능.

  - name: "hvacr01-raw-archive"
    type: "century_hvacr01_status"
    config:
      agent_ref: "century-living-room"
      poll_interval: "100ms"
      batch_size: 64
      emit_raw_frames: true    # ring buffer 의 모든 raw frame emit (rename 이후 통합 옵션)
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  - name: "raw-file"
    type: "bridge"
    config:
      payload_format: "json"
      publish_topic: "./data/century-frames.jsonl"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "raw-file-logger"
      direction: "out"

  # ═══════════════════════════════════════════════════════════════════
  # 3. 제어 미지원 데모 — passive 정책 가시화
  # ═══════════════════════════════════════════════════════════════════
  #
  # century_hvacr01_control 노드는 어떤 제어 메시지가 들어와도 not_supported 응답을
  # 반환하며 에이전트의 transport.Write 경로를 호출하지 않는다 (AC-C3).
  # downstream 의 status 필드로 분기 처리 가능.
  #
  # 본 데모에서는 stdout-logger 의 "in" 경로(예: MQTT 토픽 등)에서 제어
  # 명령을 흘려보내고, century_hvacr01_control 의 응답을 다시 stdout 으로 출력한다.

  - name: "control-input"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"
    agent_ref:
      agent_name: "stdout-logger"
      direction: "in"

  - name: "hvacr01-control"
    type: "century_hvacr01_control"
    config:
      agent_ref: "century-living-room"
      timeout: "5s"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  - name: "control-stdout"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "stdout-logger"
      direction: "out"

  # ═══════════════════════════════════════════════════════════════════
  # 에러 라우팅
  # ═══════════════════════════════════════════════════════════════════

  - name: "error-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "error-logger"
      direction: "out"

wires:
  # 1. 디코딩된 status 이벤트 → stdout
  - source: "hvacr01-status:out"
    target: "status-stdout:in"

  # 2. 원시 프레임 → 파일 아카이브 (status 노드의 emit_raw_frames 옵션)
  - source: "hvacr01-raw-archive:out"
    target: "raw-file:in"

  # 3. 제어 명령 수신 → not_supported 응답 → stdout
  - source: "control-input:out"
    target: "hvacr01-control:in"
  - source: "hvacr01-control:out"
    target: "control-stdout:in"

  # 에러 라우팅
  - source: "hvacr01-status:error"
    target: "error-logger:in"
  - source: "hvacr01-raw-archive:error"
    target: "error-logger:in"
  - source: "control-input:error"
    target: "error-logger:in"
  - source: "hvacr01-control:error"
    target: "error-logger:in"
