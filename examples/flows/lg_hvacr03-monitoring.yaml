# lg_hvacr03-monitoring.yaml
# LG HVACR-03 (PMBUSB00A Modbus 게이트웨이) 상태 모니터링 + 알람 플로우
#
# 에이전트가 실내기를 주기 폴링하여 상태 변경 시 push 하고, 상태 노드가 이를
# 받아 콘솔에 찍고 에러·알람만 따로 걸러낸다.
#
# 출력 메시지 형식 (device_state — lg_hvacr02 와 동일):
#   {
#     "unit_id": "3",
#     "device_id": "<UUID v4>",
#     "trigger": "change",
#     "state": {
#       "power": true,
#       "current_temperature": 24.5,
#       "target_temperature": 26.0,
#       "fan_speed": 5,
#       "mode": 1,
#       "error_code": 0,
#       "alarm": false,
#       "filter_alarm": false,
#       "lock_remote": false
#     },
#     "metadata": {"name": "거실", "address": "3", "device_type": "HVACR.IDU"},
#     "last_seen_ms": 1757808000000
#   }
#
# 주소 표기: PMBUSB00A 의 실내기 주소 N 은 10진(0~15)이다. LG ICP-02 의 8자리
# hex 주소("44550067")와는 별개의 값이므로 혼동하지 않는다.
#
# 사전 준비:
#   xflow agent import -f examples/agents/lg_hvacr03-rtu.yaml
#
# 사용법:
#   xflow flow deploy -f examples/flows/lg_hvacr03-monitoring.yaml

name: "lg_hvacr03-monitoring"
description: "PMBUSB00A Modbus 게이트웨이 실내기 상태 모니터링 및 알람 분리"
config:
  track_history: true
  max_history_size: 500
  error_handling: "propagate"
  log_level: "info"
metadata:
  author: "xtra"
  version: "1.0"
  domain: "hvac-monitoring"

required_agents:
  - name: "lg-pmbus-gateway"
    type: "lg_hvacr03"
  - name: "stdout-logger"
    type: "logger"
  - name: "alarm-logger"
    type: "logger"
  - name: "error-logger"
    type: "logger"

nodes:
  # ── 1단계: 실내기 상태 수신 ──
  # push 모델이라 폴링 설정이 필요 없다. 에이전트가 상태 변경을 감지하면
  # 노드가 즉시 받는다. unit_id 를 지정하면 그 실내기만 통과시킨다.
  - name: "pmbus-status"
    type: "lg_hvacr03_status"
    config:
      agent_ref: "lg-pmbus-gateway"
      # unit_id: "3"        # 10진 실내기 번호. 생략하면 전체 실내기 수신
      inactivity_timeout: "90s"
      timeout: "5s"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  # ── 2단계: 콘솔 출력 (전체 상태) ──
  - name: "console-output"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "stdout-logger"
      direction: "out"

  # ── 3단계: 알람 필터 ──
  # 에러 코드가 0 이 아니거나 알람 비트가 선 실내기만 통과시킨다.
  # PMBUSB00A 가 lg_hvacr02 대비 새로 노출하는 정보다.
  - name: "alarm-filter"
    type: "filter"
    config:
      condition: "$.payload.state.error_code != 0 || $.payload.state.alarm == true"
    inputs:
      - "in"
    outputs:
      - "out"

  # ── 4단계: 알람 메시지 변환 ──
  - name: "alarm-transform"
    type: "transform"
    config:
      expression: |
        {
          unit: $.payload.metadata.name,
          address: $.payload.unit_id,
          error_code: $.payload.state.error_code,
          alarm: $.payload.state.alarm,
          filter_alarm: $.payload.state.filter_alarm,
          room_temp: $.payload.state.current_temperature,
          at: $.payload.last_seen_ms
        }
    inputs:
      - "in"
    outputs:
      - "out"

  - name: "alarm-output"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "alarm-logger"
      direction: "out"

  # ── 에러 로깅 ──
  - name: "error-handler"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "error-logger"
      direction: "out"

wires:
  # 상태 → 콘솔 (전체)
  - source: "pmbus-status:out"
    target: "console-output:in"

  # 상태 → 알람 필터 (팬아웃)
  - source: "pmbus-status:out"
    target: "alarm-filter:in"

  # 알람 필터 → 변환 → 알람 로그
  - source: "alarm-filter:out"
    target: "alarm-transform:in"
  - source: "alarm-transform:out"
    target: "alarm-output:in"

  # 에러 라우팅
  - source: "pmbus-status:error"
    target: "error-handler:in"
