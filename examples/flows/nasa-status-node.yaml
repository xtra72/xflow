# nasa-status-node.yaml
# Samsung NASA HVAC 디바이스 상태 모니터링 플로우 (nasa-status 노드 사용)
#
# nasa-status 노드는 Samsung NASA 에이전트에 직접 연결하여
# 디바이스 상태를 조회하고 주기적으로 폴링한다.
# bridge 노드 + CommandPollAdapter 조합을 단일 노드로 대체한다.
#
# ┌──────────────────────────────────────────────────────────────────┐
# │                        데이터 흐름                                │
# ├──────────────────────────────────────────────────────────────────┤
# │                                                                  │
# │  [상태 폴링 경로]                                                │
# │    nasa-status ──→ state-filter ──→ state-pub                   │
# │                                                                  │
# │  [에러 → 로깅]                                                   │
# │    *:error ──→ error-logger                                      │
# │                                                                  │
# └──────────────────────────────────────────────────────────────────┘
#
# nasa-status 노드 설정:
#   agent_ref:     Samsung NASA 에이전트 이름 (필수)
#   device_id:     조회할 디바이스 ID (선택, 비워두면 전체 조회)
#   poll_interval: 폴링 주기 (선택, 기본값 "30s")
#   timeout:       Process 호출 타임아웃 (선택, 기본값 "5s")
#
# 출력 메시지 형식 (단일 디바이스):
#   {
#     "status": "ok",
#     "device_id": "living-room",
#     "state": {
#       "power": "on",
#       "mode": "cool",
#       "target_temperature": 24,
#       "current_temperature": 25.5
#     }
#   }
#
# 출력 메시지 형식 (전체 디바이스 - device_id 미설정):
#   {
#     "status": "ok",
#     "devices": [
#       { "address": "20 00 00", "device_id": "living-room", ... },
#       { "address": "20 00 01", "device_id": "bedroom", ... }
#     ]
#   }
#
# 사용법:
#   xflow agent import -f examples/agents/samsung-nasa-serial.yaml
#   xflow agent import -f examples/agents/mqtt-broker.yaml
#   xflow agent import -f examples/agents/console-logger.yaml
#   xflow flow import -f examples/flows/nasa-status-node.yaml
#   xflow flow deploy nasa-status-node
#   xflow flow start nasa-status-node

name: "nasa-status-node"
description: "Samsung NASA 디바이스 상태 모니터링 - nasa-status 노드 사용"
config:
  track_history: true
  max_history_size: 200
  error_handling: "propagate"
  log_level: "info"
metadata:
  author: "xtra"
  version: "1.0"
  domain: "hvac-monitoring"

required_agents:
  - name: "samsung-nasa-agent"
    type: "samsung-nasa"
  - name: "mqtt-broker"
    type: "mqtt"
  - name: "console-logger"
    type: "console-logger"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 상태 폴링 경로
  # ═══════════════════════════════════════════════════════════════

  # ── 1단계: NASA 디바이스 상태 폴링 ──
  # nasa-status 노드가 poll_interval 주기로 자동 상태 조회를 수행한다.
  # device_id를 지정하면 해당 디바이스만, 미지정 시 전체 디바이스를 조회한다.
  - name: "nasa-poller"
    type: "nasa-status"
    config:
      agent_ref: "samsung-nasa-agent"
      device_id: "living-room"
      poll_interval: "10s"
      timeout: "5s"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  # ── 2단계: 상태 변경 필터링 ──
  # 온도 변화 또는 모드 변경이 있는 이벤트만 통과시킨다.
  - name: "state-filter"
    type: "filter"
    config:
      condition: "$.payload.state != nil"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  # ── 3단계: MQTT 상태 토픽으로 발행 ──
  - name: "state-pub"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "mqtt-broker"
      direction: "out"

  # ═══════════════════════════════════════════════════════════════
  # 에러 로깅
  # ═══════════════════════════════════════════════════════════════

  - name: "error-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "console-logger"
      direction: "out"

wires:
  # 상태 폴링 경로
  - source: "nasa-poller:out"
    target: "state-filter:in"
  - source: "state-filter:out"
    target: "state-pub:in"

  # 에러 라우팅
  - source: "nasa-poller:error"
    target: "error-logger:in"
  - source: "state-filter:error"
    target: "error-logger:in"
