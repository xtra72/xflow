# mqtt-metrics.yaml
# 센서 데이터를 수신하여 특정 필드만 추출하고 메트릭을 생성하는 플로우
#
# 입력: MQTT 구독 (mqtt-sensor-agent 에이전트 사용)
# 구성: MQTT 수신 → 필터 → 필드 추출 → 집계 → 콘솔 출력
#
# 입력 메시지 형식:
#   {
#     "device_id": "sensor-001",
#     "location": "factory-A/line-3",
#     "timestamp": "2026-02-19T10:30:00Z",
#     "temperature": 72.5,
#     "humidity": 45.2,
#     "pressure": 1013.25,
#     "battery": 87,
#     "firmware": "v2.1.0",
#     "raw_adc": [1024, 2048, 512]
#   }
#
# 출력 메트릭 형식 (다중 필드/다중 함수 모드):
#   {
#     "stats": {
#       "temperature": {"avg": 71.8, "min": 68.2, "max": 75.1, "count": 10},
#       "humidity": {"avg": 45.2, "min": 40.0, "max": 50.5, "count": 10}
#     },
#     "window_count": 10,
#     "window_type": "count",
#     "window_size": 10
#   }
#
# 사용법:
#   xflow agent import -f examples/agents/mqtt-sensor.yaml
#   xflow agent import -f examples/agents/console-logger.yaml
#   xflow agent import -f examples/agents/error-logger.yaml
#   xflow flow import -f examples/flows/mqtt-metrics.yaml
#   xflow flow deploy mqtt-metrics
#   xflow flow start mqtt-metrics

name: "mqtt-metrics"
description: "센서 데이터에서 temperature/humidity 필드만 추출하여 10건 단위 메트릭을 생성"
config:
  track_history: true
  max_history_size: 500
  error_handling: "propagate"
  log_level: "info"
  log_output: "stdout+/tmp/xflow-logs/mqtt-metrics.log"
metadata:
  author: "xtra"
  version: "1.0"
  domain: "iot-metrics"

nodes:
  # ── 1단계: 센서 데이터 수신 ──
  # MQTT 브로커에서 센서 데이터를 구독한다.
  #
  # payload_format: 수신 데이터의 페이로드 변환 방식
  #   "auto"   - JSON 파싱 시도, 실패 시 {"raw": string} (기본값)
  #   "json"   - 엄격한 JSON 파싱, 실패 시 에러 (에러 포트로 라우팅)
  #   "raw"    - 항상 {"raw": string(data)} 으로 저장
  #   "binary" - 항상 {"_raw": []byte(data)} 으로 저장
  #
  # topics: Bridge 초기화 시 에이전트에 추가 구독을 요청할 토픽 목록
  #   에이전트가 SubscriberAgent 인터페이스를 구현하는 경우에만 적용된다.
  #   에이전트 자체 설정 토픽(config.topics)과 별도로 관리되며,
  #   Bridge 셧다운 시 여기서 추가한 토픽만 자동 해제된다.
  #   런타임 중에는 제어 메시지(action: subscribe/unsubscribe)로 동적 토픽 관리도 가능하다.
  - name: "sensor-receiver"
    type: "bridge"
    config:
      payload_format: "json"
      topics:
        - "application/#"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"
    agent_ref:
      agent_name: "mqtt-sensor-agent"
      direction: "in"

  # ── 2단계: 유효성 필터 ──
  # temperature 범위(-40 ~ 150)와 humidity 범위(0 ~ 100)를 벗어나는 데이터를 제거한다.
  - name: "range-validator"
    type: "filter"
    config:
      condition: "$.object.temperature >= -40 && $.object.temperature <= 150 && $.object.humidity >= 0 && $.object.humidity <= 100"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  # ── 3단계: 필드 추출 ──
  # 원본 메시지에서 메트릭에 필요한 필드(device_id, location, temperature, humidity)만 추출한다.
  # firmware, raw_adc, battery 등 불필요한 필드는 버린다.
  # log_output: 이 노드의 로그만 별도 파일로 분리 (플로우 기본값 대신 노드 전용 경로 사용)
  - name: "field-extractor"
    type: "transform"
    config:
      log_level: "debug"
      log_output: "/tmp/xflow-logs/field-extractor.log"
      expression: |
        {
          device_id: $.payload.deviceInfo.devEui,
          location: $.payload.deviceInfo.tags.location,
          temperature: $.payload.object.temperature,
          humidity: $.payload.object.humidity
        }
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  # ── 4단계: 메트릭 집계 ──
  # 10건의 메시지를 모아 다중 필드에 대해 다중 집계 함수를 실행한다.
  # window_type: "count" (메시지 개수 기반), window_size: 10
  # aggregate_fn: 리스트 형태로 여러 함수를 동시에 적용 가능 (sum, avg, min, max, count, first, last)
  # fields: 리스트 형태로 여러 필드를 독립적으로 집계 가능
  #
  # 출력은 stats 매트릭스 형태:
  #   stats[필드명][함수명] = 결과값
  #
  # 단일 함수+단일 필드인 경우 기존 호환 포맷(result + count)도 함께 출력된다.
  - name: "metrics-aggregator"
    type: "aggregate"
    config:
      log_level: "debug"
      window_type: "count"
      window_size: 10
      aggregate_fn:
        - "avg"
        - "min"
        - "max"
        - "count"
      fields:
        - "temperature"
        - "humidity"
    inputs:
      - "in"
    outputs:
      - "out"

  # ── 5단계: 메트릭 출력 ──
  # 생성된 메트릭을 콘솔에 JSON 형식으로 출력한다.
  - name: "metrics-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "console-logger"
      direction: "out"

  # ── 6단계: 메트릭 출력 ──
  # 생성된 메트릭을 콘솔에 JSON 형식으로 출력한다.
  - name: "trace-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "console-logger"
      direction: "out"

  # ── 에러 로깅 ──
  # 범위를 벗어나거나 파싱 실패한 데이터를 [ERROR] 접두사로 출력한다.
  - name: "error-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "error-logger"
      direction: "out"

wires:
  # 센서 수신 → 유효성 필터
  - source: "sensor-receiver:out"
    target: "range-validator:in"
    mode: "buffer"
    buffer_size: 100

  # 유효성 필터 → 필드 추출
  - source: "range-validator:out"
    target: "field-extractor:in"

  # 필드 추출 → 메트릭 집계
  - source: "field-extractor:out"
    target: "metrics-aggregator:in"

  # 메트릭 집계 → 출력
  - source: "metrics-aggregator:out"
    target: "metrics-logger:in"

  # 센서 수신 에러 → 에러 로깅
  - source: "sensor-receiver:error"
    target: "error-logger:in"

  # 유효성 필터 에러(범위 초과) → 에러 로깅
  - source: "range-validator:error"
    target: "error-logger:in"

  # 필드 추출 에러 → 에러 로깅
  - source: "field-extractor:error"
    target: "error-logger:in"
