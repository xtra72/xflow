# samsung_hvacr01-control-node.yaml
# Samsung HVACR-01 디바이스 제어 플로우 (samsung_hvacr01_control 노드 사용)
#
# samsung_hvacr01_control 노드는 Samsung HVACR-01 에이전트에 직접 제어 명령을 전달한다.
# bridge 노드 + Adapter 조합을 단일 노드로 대체하며,
# 간편 형식(power, mode 등)을 자동으로 set_multiple 명령으로 변환한다.
#
# ┌──────────────────────────────────────────────────────────────────┐
# │                        데이터 흐름                                │
# ├──────────────────────────────────────────────────────────────────┤
# │                                                                  │
# │  [제어 경로 - MQTT → Samsung HVACR-01]                           │
# │    mqtt-cmd ──→ hvacr01-ctrl ──→ result-pub                     │
# │                                                                  │
# │  [에러 → 로깅]                                                   │
# │    *:error ──→ error-logger                                      │
# │                                                                  │
# └──────────────────────────────────────────────────────────────────┘
#
# samsung_hvacr01_control 노드 설정 (v0.18.26):
#   agent_ref:  Samsung HVACR-01 에이전트 이름 (필수)
#   timeout:    Process 호출 타임아웃 (선택, 기본값 "5s")
#
# 노드 config 의 device_id 필드는 v0.18.26 에서 제거되었다 — 대상 디바이스는
# 항상 입력 메시지의 payload-level override 로 지정한다 (device_id 또는 unit_id).
#
# 지원하는 입력 형식:
#
#   1) 간편 형식 - 자동으로 set_multiple 명령으로 변환:
#     { "device_id": "living-room", "power": true, "mode": "cool", "temperature": 24 }
#
#   2) 직접 명령 형식 - Samsung HVACR-01 Process()에 그대로 전달:
#     { "command": "set_power", "device_id": "living-room", "power": true }
#     { "command": "set_multiple", "device_id": "living-room",
#       "params": { "mode": "cool", "target_temp": 24 } }
#
# 간편 형식에서 인식하는 제어 키:
#   power, mode, temperature, target_temp, fan_speed
#
# 사용법:
#   xflow agent import -f examples/agents/samsung_hvacr01-serial.yaml
#   xflow agent import -f examples/agents/mqtt-broker.yaml
#   xflow agent import -f examples/agents/stdout-logger.yaml
#   xflow agent import -f examples/agents/error-logger.yaml
#   xflow flow import -f examples/flows/samsung_hvacr01-control-node.yaml
#   xflow flow deploy samsung_hvacr01-control-node
#   xflow flow start samsung_hvacr01-control-node

name: "samsung_hvacr01-control-node"
description: "Samsung HVACR-01 MQTT 제어 - samsung_hvacr01_control 노드 사용"
config:
  track_history: true
  max_history_size: 500
  error_handling: "propagate"
  log_level: "info"
metadata:
  author: "xtra"
  version: "1.0"
  domain: "hvac-control"

required_agents:
  - name: "samsung-hvacr01-agent"
    type: "samsung_hvacr01"
  - name: "mqtt-broker"
    type: "mqtt-client"
  - name: "stdout-logger"
    type: "logger"
  - name: "error-logger"
    type: "logger"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 제어 경로: MQTT → Samsung HVACR-01
  # ═══════════════════════════════════════════════════════════════

  # ── 1단계: MQTT 제어 명령 수신 ──
  # 토픽 hvac/control 를 구독하여 에어컨 제어 명령을 수신한다.
  - name: "mqtt-cmd"
    type: "bridge"
    config:
      topics:
        - "hvac/control"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"
    agent_ref:
      agent_name: "mqtt-broker"
      direction: "in"

  # ── 2단계: Samsung HVACR-01 에이전트에 제어 명령 전송 ──
  # samsung_hvacr01_control 노드가 간편 형식을 자동으로 set_multiple로 변환한다.
  # bridge + transform 조합 없이 단일 노드로 처리 가능하다.
  #
  # 입력 예시:
  #   { "device_id": "living-room", "power": true, "mode": "cool", "temperature": 24 }
  # 자동 변환:
  #   { "command": "set_multiple", "device_id": "living-room",
  #     "params": { "power": true, "mode": "cool", "target_temp": 24, ... } }
  - name: "hvacr01-ctrl"
    type: "samsung_hvacr01_control"
    config:
      agent_ref: "samsung-hvacr01-agent"
      timeout: "5s"
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"

  # ── 3단계: 제어 결과를 MQTT로 발행 ──
  - name: "result-pub"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "mqtt-broker"
      direction: "out"

  # ═══════════════════════════════════════════════════════════════
  # 에러 로깅
  # ═══════════════════════════════════════════════════════════════

  - name: "error-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "error-logger"
      direction: "out"

wires:
  # 제어 경로: MQTT 명령 → Samsung HVACR-01 → 결과 발행
  - source: "mqtt-cmd:out"
    target: "hvacr01-ctrl:in"
  - source: "hvacr01-ctrl:out"
    target: "result-pub:in"

  # 에러 라우팅
  - source: "mqtt-cmd:error"
    target: "error-logger:in"
  - source: "hvacr01-ctrl:error"
    target: "error-logger:in"
