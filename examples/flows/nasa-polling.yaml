# nasa-polling.yaml
# Samsung NASA HVAC 디바이스 상태를 주기적으로 폴링하는 플로우
#
# CommandPollAdapter를 사용하여 에이전트에 get_all_states 명령을 보내고
# 응답을 플로우 메시지로 변환한다.
#
# 출력 메시지 형식 (poll 응답):
#   {
#     "status": "ok",
#     "devices": [
#       {
#         "address": "200000",
#         "device_id": "living-room",
#         "device_type": "indoor",
#         "online": true,
#         "state": {
#           "power": "on",
#           "mode": "cool",
#           "target_temperature": 24,
#           "current_temperature": 25.5
#         },
#         "last_seen": "2026-03-12T00:15:35+09:00"
#       }
#     ]
#   }
#
# 사용법:
#   xflow agent import -f examples/agents/samsung-nasa.yaml
#   xflow agent import -f examples/agents/stdout-logger.yaml
#   xflow agent import -f examples/agents/error-logger.yaml
#   xflow flow import -f examples/flows/nasa-polling.yaml
#   xflow flow deploy nasa-polling
#   xflow flow start nasa-polling

name: "nasa-polling"
description: "Samsung NASA HVAC 디바이스 상태를 주기적 폴링으로 수집"
config:
  track_history: true
  max_history_size: 200
  error_handling: "propagate"
  log_level: "info"
metadata:
  author: "xtra"
  version: "1.0"
  domain: "hvac-monitoring"

required_agents:
  - name: "samsung-nasa-agent"
    type: "samsung-nasa"
  - name: "stdout-logger"
    type: "logger"
  - name: "error-logger"
    type: "logger"

nodes:
  # ── 1단계: NASA 디바이스 상태 수신 (CommandPollAdapter 폴링) ──
  # samsung-nasa 어댑터가 CommandPollAdapter를 구현하므로
  # 브릿지가 자동으로 get_all_states 폴링 루프를 시작한다.
  - name: "nasa-poller"
    type: "bridge"
    config:
      polling_interval_ms: 5000
    inputs:
      - "in"
    outputs:
      - "out"
    errors:
      - "error"
    agent_ref:
      agent_name: "samsung-nasa-agent"
      direction: "in"

  # ── 2단계: 디바이스 상태 출력 ──
  - name: "state-logger"
    type: "bridge"
    inputs:
      - "in"
    outputs:
      - "out"
    agent_ref:
      agent_name: "stdout-logger"
      direction: "out"

wires:
  - source: "nasa-poller:out"
    target: "state-logger:in"
