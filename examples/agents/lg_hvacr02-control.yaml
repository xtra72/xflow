# LG HVACR-02 Indoor Unit Control Agent
# RS-485 시리얼 포트에서 LG ICP-02 패킷 캡처 + 실내기 능동 제어
#
# LG ICP-02 (LG Internal Control Protocol, 2세대):
#   - 가변 길이 프레임 (STX=0x56, LEN 바이트로 길이 지정)
#   - CRC-16/XMODEM (poly=0x1021, init=0x0000)
#   - 패시브 모니터링 + 능동 제어 (전원/온도/풍량/모드)
#
# 제어 명령:
#   set_power       - 전원 ON/OFF
#   set_temperature - 설정 온도 (15~30도)
#   set_fan_speed   - 풍량 (low/medium/high/turbo/auto)
#   set_mode        - 운전모드 (cooling/dehumidify/fan/auto/heating)
#   set_multiple    - 여러 설정 동시 변경
#
# 전송 모드:
#   - serial    : RS-485 시리얼 포트 직접 연결 (기본값, 이 예제)
#   - tcp-client: RS485-to-TCP 컨버터에 접속 (lg_hvacr02-tcp-client.yaml 참고)
#   - tcp-server: TCP 접속을 수락하여 수신 (lg_hvacr02-tcp-server.yaml 참고)
#
# 사용법:
#   xflow agent import -f examples/agents/lg_hvacr02-control.yaml

name: "lg_hvacr02-control"
type: "lg_hvacr02"

config:
  # ── 전송 모드 (serial | tcp-client | tcp-server) ──
  transport_type: "serial"

  # RS-485 시리얼 포트 (transport_type: "serial" 일 때 필수)
  serial_port: "/dev/tty.usbserial-11310"

  # 통신 설정
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: "none"

  # 읽기 타임아웃
  read_timeout: "500ms"

  # CRC 검증 활성화
  verify_crc: true

  # 자동 디바이스 발견
  auto_discovery: true

  # 사전 등록 디바이스
  # devices:
  #   - address: "44550067"
  #     name: "living-room"

  # 메시지 채널 버퍼 크기
  msg_channel_size: 256

  # 재연결 설정
  reconnect_interval: "5s"
  max_reconnect_backoff: "5m"

  # ── 제어 기능 ──
  control_enabled: true
  controller_address: "44550000"       # 컨트롤러 SA 주소 (8자리 HEX)
  control_verify_timeout: "3s"         # 제어 후 상태 확인 대기
