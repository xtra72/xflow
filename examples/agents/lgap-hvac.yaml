# LG LGAP HVAC Agent
# RS-485 시리얼 포트를 통해 LG 실내기와 LGAP 프로토콜로 통신
#
# LGAP (LG Air-conditioning Protocol):
#   - 4800 baud, 8N1 시리얼 통신
#   - zone 주소 기반 디바이스 식별 (0x10 ~ 0xFF)
#   - 상태 조회 및 온도/모드/풍량 제어 지원
#
# 사용법:
#   xflow agent import -f examples/agents/lgap-hvac.yaml

name: "lgap-hvac"
type: "lgap"

config:
  # RS-485 시리얼 포트 (필수)
  serial_port: "/dev/tty.usbserial-11310"

  # LGAP 표준 통신 설정
  baud_rate: 4800
  data_bits: 8
  stop_bits: 1
  parity: "none"

  # 타임아웃 설정
  read_timeout: "1000ms"

  # 폴링 간격 (디바이스 상태 조회 주기)
  poll_interval: "30s"

  # 명령 간 딜레이 (RS-485 버스 충돌 방지)
  inter_command_delay: "100ms"

  # 디바이스 목록 (zone 주소 + 이름)
  devices:
    - address: "0x0"
      name: "all"

  # 메시지 채널 버퍼 크기
  msg_channel_size: 256

  # 오프라인 판정 (연속 N회 응답 실패 시)
  offline_threshold: 3

  # 재연결 설정
  reconnect_interval: "5s"
  max_reconnect_backoff: "5m"

  # 연결 상태(online/offline) 리포팅 (SPEC-HVACR-CONNSTATE-001)
  # device_connection.<trigger> 메시지를 device 당 개별로 방출한다.
  #   - trigger=initial: Start 직후 startup probe 로 확정한 초기 상태 (device 당 프로세스 수명 1회)
  #   - trigger=change : online↔offline 전이 즉시 (아래 interval 과 무관하게 항상 방출)
  #   - trigger=report : 아래 주기마다 등록된 모든 device (offline 포함)
  #
  # 참고: 이 LGAP 예시는 동작 상태 report_interval 을 설정하지 않는다(기본 0=비활성).
  # connection_report_interval 은 report_interval 과 독립적이므로, 동작 상태 리포팅이
  # 꺼져 있어도 연결 상태 리포팅은 아래 값으로 독립적으로 동작한다.
  #
  # 주기 연결 리포트 간격 (기본값: "60s", "0s"=주기 리포트 비활성 — 단 initial/change 는 항상 방출)
  connection_report_interval: "60s"

  # startup probe 의 bounded timeout (선택).
  # 미설정 시 poll_interval 에서 파생: min(2×poll_interval, 30s) (poll_interval=0 이면 10s).
  # 명시하면 그 값을 그대로 존중한다(30s 캡 미적용).
  # startup_probe_timeout: "30s"
