# MQTT Sensor Agent Example
# MQTT 브로커에 연결하여 센서 데이터를 수집하는 에이전트
#
# 사용법:
#   xflow agent import -f examples/agents/mqtt-sensor.yaml

# 에이전트 이름 (필수)
name: "mqtt-sensor-agent"

# 에이전트 타입 (필수)
type: "mqtt"

# 에이전트 설정
config:
  # MQTT 브로커 주소
  broker: "tcp://localhost:1883"

  # 클라이언트 ID
  client_id: "xflow-sensor-001"

  # 구독 토픽 목록
  topics:
    - "sensors/temperature/#"
    - "sensors/humidity/#"

  # QoS 레벨 (0: at most once, 1: at least once, 2: exactly once)
  qos: 1

  # 연결 유지 간격 (초)
  keep_alive_sec: 60

  # 자동 재연결 활성화
  auto_reconnect: true

  # 클린 세션 사용
  clean_session: true
