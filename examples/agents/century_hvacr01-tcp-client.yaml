# Century HVACR-01 passive sniff agent — TCP-client mode (SPEC-CENTURY-HVACR-001 v0.2.0)
#
# 식별자 매핑 (rename 이후):
#   - 프로토콜 코드: century_icp01 (Century ICP-01 wire protocol)
#   - 에이전트 타입: century_hvacr01 (Century HVACR-01)
#
# 시리얼-Ethernet 컨버터(Moxa NPort, USR-N520 등)가 RS-485 회선을 TCP socket 으로
# forward 하는 환경에서 xflow 가 능동적으로 컨버터에 접속하여 Century ICP-01 프레임을 수신한다.
#
#   [Century 컨트롤러] ──RS-485──→ [시리얼-Ethernet 컨버터] ──TCP──→ [xflow century_hvacr01 (tcp-client)]
#
# 본 에이전트는 RX-only 로 작동한다 — TCP wrapper 의 Write 는 ErrTransportPassiveOnly 를
# 반환하므로 회선상으로 어떠한 바이트도 송신되지 않는다 (AC-B9, AC-G8 invariant).
#
# 연결이 끊기면 (io.EOF / read timeout / network error) reconnect_interval 부터
# exponential backoff 로 자동 재연결한다 (5s → 10s → 20s → ... → max_reconnect_backoff).
#
# 사용법:
#   xflow agent import -f examples/agents/century_hvacr01-tcp-client.yaml
#   xflow agent start century-living-room-tcp

id: "century-living-room-tcp"
name: "century-living-room-tcp"
type: "century_hvacr01"

transport:
  type: "serial"  # top-level transport.type 은 무시되며 options.transport_type 이 우선
  options:
    # ── TCP-client 모드 ──
    transport_type: "tcp-client"

    # 컨버터의 TCP endpoint (LAN 내 fixed IP)
    tcp_host: "192.168.1.100"
    tcp_port: 4196

    # TCP 타임아웃
    tcp_connect_timeout: "5s"   # net.Dialer.Timeout
    tcp_read_timeout: "3s"      # 매 read 직전 SetReadDeadline 갱신

    # 재연결 backoff (REQ-CENTURY-031)
    # v0.19.0+: reconnect_initial → reconnect_interval 로 rename (Samsung 의 동명 필드와 정렬).
    # 이전 키 reconnect_initial 는 더 이상 인식되지 않으며 parse error 로 거부된다.
    reconnect_interval: "5s"
    max_reconnect_backoff: "5m"

    # ── Century 프로토콜 주소 (단일 IDU 환경 기본값) ──
    master_address: "0x0030"
    slave_address: "0x0001"
    sub_dev_id: "0x3B"

    # ── 캡처 ring buffer ──
    ring_buffer_size: 128

    # ── 오프라인 감지 ──
    # TCP 모드에서 연결 끊김 동안 frame 수신이 없으므로 이 timeout 후 device 오프라인 전이.
    # 재연결 + 수신 재개 시 다음 frame 수신 시점에 자동 online 복귀.
    # v0.19.0+: 기본값이 "5s" → "30s" 로 변경 (LG / Samsung 와 정렬).
    # 5s 의 빠른 반응이 필요한 환경에서는 명시적으로 "5s" 설정.
    offline_timeout: "5s"

    # ── 다중 IDU 자동 발견 ──
    auto_discovery: true

    # ── WRITE 중복 제거 (REQ-CENTURY-027) ──
    dedupe_writes: true
    # cycle_idle_timeout 미설정 시 transport-aware default 200ms 적용 (REQ-CENTURY-032).
    # 명시 시 transport 와 무관하게 그 값 사용.

    # ── v0.3.0 출력 정책 (REQ-CENTURY-033/034/035) ──
    # 기본 출력은 통합 device state event (전원/모드/풍량/설정온도/현재온도 + 증발기 온도).
    # v0.2.x 의 register-decoded 출력을 사용하던 downstream 은 emit_register_decoded 를
    # true 로 활성화해야 한다 (마이그레이션 가이드: SPEC §5.12 참조).
    emit_device_state: true       # v0.3.0 기본 — 통합 device state event emit
    emit_register_decoded: false  # v0.2.x 호환 — true 면 Reg02Decoded 등 register 단위 emit
    report_interval: "60s"     # 변경 없을 때 N 초마다 keepalive emit (0=비활성, 권장 ≥30s)
    report_mode: "relative"    # v0.3.9 — "relative": 마지막 emit 으로부터 interval, "absolute": wall-clock 정렬 (매 분/5분/시 등, crontab 패턴)
    include_inferred_fields: false # register-decoded 메시지에 inferred (추정 의미) 필드 포함 여부. op_val_*, status_bits, temp_A_c, reg04_const_* 등. 운영=false, 검증/모니터링=true
    include_unknown_fields: false # register-decoded 메시지에 unknown (padding/reserved) 필드 포함 여부. reg03_pad_*, reg04_byte_3..6 등. 운영=false, 디버깅/RE=true
    include_register_info: false  # register-decoded 메시지에 register 번호 + direction 등 register 메타 포함 여부. 운영=false, 분석=true
    include_raw_hex: false        # register-decoded 메시지에 raw_hex (원시 바이트 hex) 포함 여부. 운영=false, RE=true. century_hvacr01_status 노드의 emit_raw_frames 옵션은 이 설정과 무관하게 항상 raw bytes 노출

    # ── 로그 레벨 ──
    # log_decode_errors / log_drops / log_state_updates 는 3종 HVACR-01 에이전트 공통 키.
    log_decode_errors: false
    log_drops: false
    log_state_updates: false
    log_unconfirmed_fields: false
