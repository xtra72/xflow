# Samsung NASA HVAC Agent - Serial 모드
# RS-485 시리얼 포트를 통해 NASA 실내기/실외기와 직접 통신
#
# 사용법:
#   xflow agent import -f examples/agents/samsung-nasa.yaml

name: "samsung-nasa-agent"
type: "samsung-nasa"

config:
  # 트랜스포트 타입 (필수): serial 또는 tcp
  transport_type: "serial"

  # RS-485 시리얼 포트 설정
  serial_port: "/dev/tty.usbserial-111310"
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: "even"

  # 타임아웃 설정
  read_timeout: "3s"

  # 폴링 간격 (디바이스 상태 조회 주기)
  poll_interval: "30s"

  # 디바이스 목록 (주소 + 이름)
  # 실외기: 10.xx.00, 실내기: 20.xx.yy
  devices:
    - address: "20.00.00"
      name: "living-room"
    - address: "20.00.01"
      name: "bedroom"
    - address: "20.00.02"
      name: "office"
    - address: "10.00.00"
      name: "outdoor-unit-1"

  # 자동 디스커버리 (버스에서 응답하는 미등록 장치 자동 추가)
  auto_discovery: true

  # 오프라인 판정 임계값 (연속 N회 응답 실패 시 오프라인)
  offline_threshold: 3

  # 메시지 채널 버퍼 크기
  msg_channel_size: 256

  # 지원하지 않는 메시지 셋 인덱스 (수신 시 필터링)
  unsupported_msg_sets:
    - 0x0608
    - 0x060C
    - 0x8601
    - 0x860C
    - 0x860D
    - 0x8601

  # 필터링된 메시지 셋 로그 출력 여부 (기본값: false)
  log_unsupported_msg_sets: false

  # 상태 조회 시 RawMessageSets 포함 여부 (기본값: true)
  # false로 설정하면 get_state/get_all_states 응답에서 RawMessageSets 제외
  include_raw_message_sets: false