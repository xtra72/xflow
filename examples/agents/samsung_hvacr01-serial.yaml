# Samsung HVACR-01 에이전트 — Serial 모드 (Samsung NASA 프로토콜)
# RS-485 시리얼 포트를 통해 Samsung NASA 실내기/실외기와 직접 통신
#
# 사용법:
#   xflow agent import -f examples/agents/samsung_hvacr01-serial.yaml

name: "samsung-hvacr01-agent"
type: "samsung_hvacr01"

config:
  # 트랜스포트 타입 (필수): serial 또는 tcp
  transport_type: "serial"

  # RS-485 시리얼 포트 설정
  serial_port: "/dev/tty.usbserial-111310"
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: "even"

  # 타임아웃 설정
  read_timeout: "3s"

  # 폴링 간격 (디바이스 상태 조회 주기)
  poll_interval: "30s"

  # 디바이스 목록 (주소 + 이름)
  # 실외기: 10.xx.00, 실내기: 20.xx.yy
  devices:
    - address: "20.00.00"
      name: "living-room"
    - address: "20.00.01"
      name: "bedroom"
    - address: "20.00.02"
      name: "office"
    - address: "10.00.00"
      name: "outdoor-unit-1"

  # 자동 디스커버리 (버스에서 응답하는 미등록 장치 자동 추가)
  # 기본값: true — 명시는 선택이며 비활성화하려면 false 로 설정.
  auto_discovery: true

  # 오프라인 판정 임계값 (연속 N회 send/build 실패 시 오프라인)
  offline_threshold: 3

  # LastSeen 기반 stale offline 판정 임계값 (device 가 이 시간 동안 프레임을 보내지
  # 않으면 오프라인 전환). Samsung 폴링은 비동기라 이 검사가 실내기 정전/응답없음을
  # 감지하는 유일한 경로다. 3-way 의미:
  #   - 미설정(키 자체를 생략): offline_threshold × poll_interval 파생 (기본 3×30s=90s)
  #   - 양수(예: "90s"): 그 값을 임계값으로 그대로 사용 (파생값을 덮어씀)
  #   - "0s": staleness 감지 완전 비활성 (단, 트랜스포트 연결 끊김 시 일괄 오프라인은 계속 동작)
  # 아래는 파생 기본값(미설정)과 동일한 90s 를 명시한 예시다. 주석 처리하면 파생을 사용한다.
  # offline_timeout: "90s"

  # 메시지 채널 버퍼 크기
  msg_channel_size: 256

  # 지원하지 않는 메시지 셋 인덱스 (수신 시 필터링)
  unsupported_msg_sets:
    - 0x0608
    - 0x060C
    - 0x8601
    - 0x860C
    - 0x860D
    - 0x8601

  # 필터링된 메시지 셋 로그 출력 여부 (기본값: false)
  log_unsupported_msg_sets: false

  # 상태 조회 시 RawMessageSets 포함 여부 (기본값: true)
  # false로 설정하면 get_state/get_all_states 응답에서 RawMessageSets 제외
  # (v1.19.0+: 3종 HVACR-01 에이전트 통일을 위해 include_raw_message_sets → include_raw_hex 로 rename.
  # 이전 키 include_raw_message_sets 는 더 이상 인식되지 않으며 parse error 로 거부된다.)
  include_raw_hex: false

  # 정기 keepalive emit 주기 (기본값: "60s", 0=비활성)
  # v1.19.0+ 부터 기본값이 "0s" → "60s" 로 변경. 변경 감지만 원하면 "0s" 명시.
  report_interval: "60s"

  # 연결 상태(online/offline) 리포팅 (SPEC-HVACR-CONNSTATE-001)
  # device_connection.<trigger> 메시지를 device 당 개별로 방출한다.
  #   - trigger=initial: Start 직후 startup probe 로 확정한 초기 상태 (device 당 프로세스 수명 1회)
  #   - trigger=change : online↔offline 전이 즉시 (아래 interval 과 무관하게 항상 방출)
  #   - trigger=report : 아래 주기마다 등록된 모든 device (offline 포함)
  # 동작 상태 report_interval 과 완전히 독립적이다.
  #
  # 주기 연결 리포트 간격 (기본값: "60s", "0s"=주기 리포트 비활성 — 단 initial/change 는 항상 방출)
  connection_report_interval: "60s"

  # startup probe 의 bounded timeout (선택).
  # 미설정 시 poll_interval 에서 파생: min(2×poll_interval, 30s) (poll_interval=0 이면 10s).
  # 명시하면 그 값을 그대로 존중한다(30s 캡 미적용 — 느린 대형 버스 등에서 의도적으로 더 길게).
  # startup_probe_timeout: "30s"

  # 로그 옵션 (3종 HVACR-01 에이전트 통일, default false)
  log_decode_errors: false
  log_drops: false
  log_state_updates: false
