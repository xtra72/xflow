# Century HVACR-01 passive sniff agent — SPEC-CENTURY-HVACR-001 reference
#
# 식별자 매핑 (rename 이후):
#   - 프로토콜 코드: century_icp01 (Century ICP-01 wire protocol)
#   - 에이전트 타입: century_hvacr01 (Century HVACR-01)
#   - 노드 타입: century_hvacr01_status / century_hvacr01_control / century_hvacr01
#   - 복합 디바이스 ID: century_icp01:<sub_dev_id_hex>  (예: century_icp01:3b)
#
# 기존 마스터(상위 컨트롤러) ↔ 슬레이브(에어컨 본체) RS-485 회선에 RX-only
# 로 부착하여 Century ICP-01 마스터-슬레이브 바이너리 프로토콜을 패시브 디코딩한다.
# 본 에이전트는 어떤 경우에도 회선에 바이트를 송신하지 않는다.
#
# 회선 구조 (proto-spec v0.3 §3):
#   - 8B 헤더 (src_addr, dst_addr LE u16, payload_length LE u16, reserved, fc)
#   - 가변 payload (페이로드 prefix: sub_dev_id, reserved2=0x00, register)
#   - 2B CRC-16/ARC (init 0x0000, RefIn/RefOut, LE 저장) — Modbus RTU 와 구분
#
# 한 polling cycle 은 약 511.9 ms (σ=0.3 ms) 이며 9 프레임으로 구성된다:
#   READ reg 0x02 → RESP → READ reg 0x03 → RESP → READ reg 0x04 → RESP
#   → WRITE reg 0x04 → ACK → WRITE reg 0x04 → ACK
# (마지막 WRITE 는 신뢰성 목적의 redundancy — dedupe_writes=true 로 합침)
#
# 3종 노드 (rename 이후 — 이전 4종에서 raw-frame 별도 노드 제거):
#   - century_hvacr01_status   : 디코딩된 reg 0x02/0x03/0x04 응답 + write 이벤트
#                                + emit_raw_frames 옵션으로 raw frame 도 emit 가능
#                                (이전 century-raw-frame 노드 흡수)
#   - century_hvacr01_control  : 항상 not_supported 반환 (API 대칭성용 placeholder)
#   - century_hvacr01          : 통합 노드 (제어 키 감지 시 not_supported, 그 외 상태)
#
# 사용법:
#   xflow agent import -f examples/agents/century_hvacr01.yaml
#   xflow agent start century-living-room

id: "century-living-room"
name: "century-living-room"
type: "century_hvacr01"

transport:
  type: "serial"
  options:
    # ── RS-485 시리얼 포트 ──
    # 보레이트는 캡처 환경 의존이며 프로토콜 문서가 명시하지 않으므로
    # 사용자가 로직 애널라이저 등으로 측정해야 한다 (R5 참조).
    serial_port: "/dev/ttyUSB0"
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: "none"
    read_timeout: "200ms"

    # ── Century 프로토콜 주소 (단일 IDU 환경 기본값) ──
    # 정수 (48) 또는 hex 문자열 ("0x0030") 모두 허용된다.
    master_address: "0x0030"
    slave_address: "0x0001"
    sub_dev_id: "0x3B"

    # ── 캡처 ring buffer ──
    # 폴링 주기 약 512 ms 기준 128 칸이면 약 65 초 분량.
    ring_buffer_size: 128

    # ── 오프라인 감지 ──
    # v0.19.0+: 기본값이 "5s" → "30s" 로 변경 (LG / Samsung 와 정렬).
    # 본 예제는 5s 의 빠른 반응을 의도적으로 유지 (폴링 주기 약 512ms 의 10배).
    offline_timeout: "5s"

    # ── 다중 IDU 자동 발견 ──
    # 회선상 새 sub_dev_id 가 관측되면 자동으로 CenturyDevice 인스턴스 생성.
    # 검증된 캡처는 단일 유닛(0x3B)뿐이지만 데이터 모델은 다중 IDU 를 지원한다.
    auto_discovery: true

    # ── WRITE 중복 제거 (REQ-CENTURY-027) ──
    # 마스터가 신뢰성 목적으로 동일 polling cycle 내에 보내는 두 번째 WRITE 를
    # decoded event 에서 합친다. raw frame 노드는 dedupe 와 무관하게 모든
    # frame 을 emit 한다.
    dedupe_writes: true
    cycle_idle_timeout: "100ms"

    # ── v0.3.0 device-centric output (Breaking, REQ-CENTURY-033/034/035) ──
    # msgCh 의 default 출력은 device-centric DeviceStateEvent (snake_case + epoch ms).
    # v0.2.x 의 register-decoded 출력을 사용하던 downstream 은 emit_register_decoded 를
    # true 로 활성화해야 한다 (마이그레이션 가이드: SPEC §5.12 참조).
    emit_device_state: true       # v0.3.0 기본 — 통합 device state event emit
    emit_register_decoded: false  # v0.2.x 호환 — true 면 Reg02Decoded 등 register 단위 emit
    report_interval: "60s"     # 변경 없을 때 N 초마다 keepalive emit (0=비활성, 권장 ≥30s)
    report_mode: "relative"    # v0.3.9 — "relative": 마지막 emit 으로부터 interval, "absolute": wall-clock 정렬 (매 분/5분/시 등, crontab 패턴)
    include_inferred_fields: false # register-decoded 메시지에 inferred (추정 의미) 필드 포함 여부. op_val_*, status_bits, temp_A_c, reg04_const_* 등. 운영=false, 검증/모니터링=true
    include_unknown_fields: false # register-decoded 메시지에 unknown (padding/reserved) 필드 포함 여부. reg03_pad_*, reg04_byte_3..6 등. 운영=false, 디버깅/RE=true
    include_register_info: false  # register-decoded 메시지에 register 번호 + direction 등 register 메타 포함 여부. 운영=false, 분석=true
    include_raw_hex: false        # register-decoded 메시지에 raw_hex (원시 바이트 hex) 포함 여부. 운영=false, RE=true. century_hvacr01_status 노드의 emit_raw_frames 옵션은 이 설정과 무관하게 항상 raw bytes 노출

    # ── 로그 레벨 (운영 기본: 통계 카운터로 충분, per-error 로그는 끔) ──
    # 신규 회선 분석 시에만 true 로 켜서 cycle 경계나 미확정 필드를 진단.
    # log_decode_errors / log_drops / log_state_updates 는 3종 HVACR-01 에이전트 공통 키.
    log_decode_errors: false
    log_drops: false
    log_state_updates: false
    log_unconfirmed_fields: false

    # ── 사전 등록 디바이스 (선택) ──
    # auto_discovery=true 여도 여기 등재된 device 는 시작 시 즉시 등록된다.
    # 주소 표기는 sub_dev_id 의 hex 문자열.
    devices:
      - address: "3b"
        name: "living-room-indoor"
