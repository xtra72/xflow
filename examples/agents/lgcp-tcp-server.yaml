# LG LGCP Packet Capture Agent (TCP Server 모드)
# TCP 포트를 열어 외부 장치의 접속을 수락하여 LGCP 패킷 수신
#
# 사용 시나리오:
#   [원격 장치/컨버터] ─→ TCP/IP 네트워크 ─→ [이 에이전트 :9100]
#
#   원격 장치나 컨버터가 이 에이전트의 TCP 포트로 접속하면,
#   해당 연결에서 LGCP 프레임을 수신한다.
#   LGCP는 point-to-point 프로토콜이므로 단일 활성 연결만 유지하며,
#   새 연결이 들어오면 기존 연결을 교체한다.
#
# transport_type: "tcp-server"
#   - 지정된 포트에서 TCP 접속 수락 (net.Listen)
#   - 단일 활성 연결 유지 (새 연결 시 기존 연결 교체)
#   - serial_port 설정 불필요
#
# 사용법:
#   xflow agent import -f examples/agents/lgcp-tcp-server.yaml

name: "lgcp-tcp-server"
type: "lgcp"

config:
  # ── 전송 모드 ──
  transport_type: "tcp-server"

  # TCP 수신 설정
  tcp_host: "0.0.0.0"           # 바인드 주소 (모든 인터페이스)
  tcp_port: 9100                 # 수신 포트

  # TCP 타임아웃 설정
  tcp_read_timeout: "30s"        # 읽기 타임아웃
  tcp_write_timeout: "5s"        # 쓰기 타임아웃

  # CRC 검증 활성화
  verify_crc: true

  # 자동 디바이스 발견
  auto_discovery: true

  # 메시지 채널 버퍼 크기
  msg_channel_size: 256

  # 재연결 설정 (클라이언트 연결 끊김 후 재수락 대기)
  reconnect_interval: "5s"
  max_reconnect_backoff: "5m"
