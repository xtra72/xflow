# TSDB Engine Agent Example
# 인메모리 시계열 데이터베이스를 관리하는 에이전트
#
# tsdb-write, tsdb-query 노드가 agent_ref로 이 에이전트를 참조하여
# TSDB 인스턴스에 접근한다.
#
# 사용법:
#   xflow agent import -f examples/agents/tsdb-engine.yaml

# 에이전트 이름 (필수)
name: "tsdb-engine"

# 에이전트 타입 (필수)
type: "tsdb"

# 에이전트 설정
config:
  # 최대 시리즈 수 (기본: 10000)
  max_series: 10000

  # 시리즈당 최대 포인트 수 (기본: 100000)
  max_points_per_series: 100000

  # 최대 메모리 사용량 MB (기본: 256)
  max_memory_mb: 256

  # 데이터 보존 기간 (기본: 24h)
  max_age: "24h"

  # 퇴거 실행 간격 (기본: 30s)
  eviction_interval: "30s"

  # 쿼리당 최대 반환 포인트 수 (기본: 10000)
  max_query_points: 10000

  # 쿼리 타임아웃 (기본: 10s)
  query_timeout: "10s"
